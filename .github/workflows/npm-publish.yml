# Publishes the @rishi-thak/nextcanvas package to npm when a GitHub Release is published.
# See: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
#
# Notes specific to this repo:
# - The package lives in nextcanvas/, not the repo root, so every step runs there
#   (defaults.run.working-directory).
# - The "build" job runs `npm ci` (triggers the package's `prepare` → tsc build of
#   dist/) AND `npm test`, so a release cannot publish if the suite is red. The
#   full cross-platform matrix runs in ci.yml on push/PR; this is the release gate.
# - The prebuilt SWC wasm (swc/nextcanvas_swc.wasm) is checked in, so CI needs no Rust.
# - `access: public` comes from package.json publishConfig, so `npm publish` needs no flag.

name: Node.js Package

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: nextcanvas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
