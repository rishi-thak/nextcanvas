# Builds and tests the @rishi-thak/nextcanvas package on every push and PR.
#
# Notes specific to this repo:
# - The package lives in nextcanvas/, so every step runs there
#   (defaults.run.working-directory).
# - `npm ci` triggers the package's `prepare` (tsc build of dist/), and
#   `npm test` re-builds and runs the node:test suite (server, security,
#   entities, tailwind, and the jsdom overlay tests).
# - The prebuilt SWC wasm (swc/nextcanvas_swc.wasm) is checked in, so CI needs
#   no Rust toolchain.
# - The OS matrix is the point: path containment, ts-morph write-back, and the
#   Windows drive-letter `data-loc` parsing are OS-sensitive, so the suite runs
#   on Linux, macOS, AND Windows to catch regressions the maintainer's single
#   dev box would miss.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: nextcanvas

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: nextcanvas/package-lock.json
      - run: npm ci
      - run: npm test
